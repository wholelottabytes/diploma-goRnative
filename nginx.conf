events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;
    upstream auth_service        { server auth_service:8080; }
    upstream user_service        { server user_service:8080; }
    upstream beat_service        { server beat_service:8080; }
    upstream interaction_service { server interaction_service:8080; }
    upstream order_service       { server order_service:8080; }
    upstream wallet_service      { server wallet_service:8080; }
    upstream analytics_service   { server analytics_service:8080; }

    server {
        listen 80;

        # ── Health checks (nginx responds directly — no upstream needed) ──
        location = /api/auth/health         { return 200; add_header Content-Length 0; }
        location = /api/users/health        { return 200; add_header Content-Length 0; }
        location = /api/beats/health        { return 200; add_header Content-Length 0; }
        location = /api/interactions/health { return 200; add_header Content-Length 0; }
        location = /api/orders/health       { return 200; add_header Content-Length 0; }
        location = /api/wallet/health       { return 200; add_header Content-Length 0; }
        location = /api/analytics/health    { return 200; add_header Content-Length 0; }

        # ── Auth ──────────────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/beats {
                    proxy_pass http://beat_service/api/v1/beats;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header Authorization $http_authorization;
                }

        # ── Users ─────────────────────────────────────────────────────────
        location /api/users {
            proxy_pass http://user_service/api/v1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Interactions ──────────────────────────────────────────────────
        location /api/interactions/ {
            proxy_pass http://interaction_service/api/v1/interactions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Orders ────────────────────────────────────────────────────────
        location /api/orders {
            proxy_pass http://order_service/api/v1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Wallet ────────────────────────────────────────────────────────
        location /api/wallet/ {
            proxy_pass http://wallet_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Analytics ─────────────────────────────────────────────────────
        location /api/analytics {
            proxy_pass http://analytics_service/api/v1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
